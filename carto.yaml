background: '#f2efe9'

layers:
- query:
    12: way[highway~"^(primary|secondary|tertiary|residential|unclassified|pedestrian)(_link)?"]
    16: way[highway~"^(primary|secondary|tertiary|residential|unclassified|living_street|pedestrian|service|footway|cycleway)(_link)?"]
  feature:
    pre: |-
      {% set width = const.highway[tags.highway].width|default(2) %}
      {% set casingWidth = const.highway[tags.highway].width|default(2) * const.highway[tags.highway].casingExpand|default(1.5) %}
      {% set fill = false %}

      {% if (is_area and not const.highway[tags.highway].noFill|default(false)) or tags.area == 'yes' %}
        {% set width = 0 %}
        {% set casingWidth = (const.highway[tags.highway].width|default(2) * const.highway[tags.highway].casingExpand|default(1.5) - const.highway[tags.highway].width|default(2)) %}
        {% set fill = true %}
      {% endif %}
    styles: |-
      {% if const.highway[tags.highway].casingExpand|default(1.5) > 1 %}
        casing_back,casing,
      {% endif %}
      default,text
    style:
      width: |-
        {{ width }}
      color: |-
        {{ const.highway[tags.highway].color|default('#ff0000') }}
      fillColor: |-
        {{ const.highway[tags.highway].color|default('#ff0000') }}
      fillOpacity: 1
      fill: |-
        {{ fill }}
      dashArray: |-
        {{ const.highway[tags.highway].dashArray|default('') }}
      zIndex: |-
        {{ tags.layer|default(0) + const.highway[tags.highway].priority|default(0) / 100 }}
    style:casing_back:
      width: |-
        {{ casingWidth }}
      color: '#d9d0c9'
      zIndex: -20
    style:casing:
      width: |-
        {{ casingWidth }}
      color: '#d9d0c9'
      lineCap: butt
      zIndex: |-
        {{ tags.layer|default(0) - 0.1 }}
    style:text:
      width: 0
      fill: false
      text: |-
        {{ tags.name }}
      zIndex: 1000
      textFontName: DejaVu Sans Book
      textFontSize: 10
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'
      textRepeatSpacing: '500'
      textPlacement: |-
        {{ is_area ? 'point' : 'line' }}

- query:
    12: nwr[waterway]
  feature:
    styles: casing,default,text
    style:
      width: |-
        {% if tags.waterway == 'river' %}6
        {% elseif tags.waterway in ['drain'] %}2
        {% else %}4
        {% endif %}
      color: '#aad3df'
      zIndex: |-
        {{ tags.layer|default(0) }}
    style:text:
      width: 0
      fill: false
      text: |-
        {{ tags.name }}
      zIndex: 1000
      textFontName: DejaVu Sans Book
      textColor: '#5f8db3'
      textFontSize: 10
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'
      textRepeatSpacing: '500'

- query:
    12: nwr[building]
  feature:
    pre: |-
      {% set color = '#d9d0c9' %}
      {% set border = '#bdaea3' %}
    styles: back,default
    style:
      width: 1
      color: |-
        {{ border }}
      opacity: 0.33
      fillColor: |-
        {{ color }}
      fillOpacity: 0.33
      zIndex: |-
        {{ tags.layer|default(0) - 0.2 }}
    style:back:
      width: 1
      color: |-
        {{ border }}
      fillColor: |-
        {{ color }}
      fillOpacity: 1
      zIndex: -22

- query:
    12: nwr[landuse]
  feature:
    style:
      fillColor: |-
        {{ const.landuse[tags.landuse].color|default('#ff0000') }}
      fillOpacity: 1
      width: 0
      zIndex: -25

- query:
    12: nwr[leisure=park]
  feature:
    style:
      fillColor: |-
        {{ const.leisure[tags.leisure].color|default('#ff0000') }}
      fillOpacity: 1
      width: 0
      zIndex: -24.5

- query:
    10: way[boundary=administrative][admin_level~"^(2|3|4|5|6|7|8|9)$"];
  feature:
    markerSymbol: false
    style:
      color: '#ff00af'
      width: 2
      dashArray: |-
        {% if tags.admin_level > 4 %}2,2
        {% endif %}
      lineCap: butt
      zIndex: 100

const:
  highway:
    primary:
      color: '#fcd6a4'
      width: 12
      priority: 17.5
    primary_link:
      color: '#fcd6a4'
      width: 6
      priority: 17
    secondary:
      color: '#f7fabf'
      width: 12
      priority: 16.5
    secondary_link:
      color: '#f7fabf'
      width: 6
      priority: 16
    tertiary:
      color: '#ffffff'
      width: 10
      priority: 15.5
    tertiary_link:
      color: '#ffffff'
      width: 5
      priority: 15
    unclassified:
      color: '#ffffff'
      width: 8
      priority: 10
    residential:
      color: '#ffffff'
      width: 8
      priority: 10
    pedestrian:
      color: '#ffffff'
      width: 8
      priority: 11
    living_street:
      color: '#ededed'
      width: 8
      priority: 9
    service:
      color: '#ffffff'
      width: 5
      priority: 5
    cycleway:
      color: '#0000ff'
      width: 1
      dashArray: '1,3'
      noFill: true
      priority: 7
    footway:
      color: '#f98577'
      width: 1
      dashArray: '1,3'
      casingExpand: 1
      noFill: true
      priority: 6

  landuse:
    construction:
      color: '#c7c7b4'
    grass:
      color: '#cdebb0'
    railway:
      color: '#eadae7'
    recreation_ground:
      color: '#b8b7b7'
    residential:
      color: '#e0dfdf'

  leisure:
    park:
      color: '#c8facc'
