background: '#f2efe9'

layers:
- query:
    12: way[highway~"^(primary|secondary|tertiary|residential|unclassified|pedestrian)(_link)?"]
    16: way[highway~"^(primary|secondary|tertiary|residential|unclassified|living_street|pedestrian|service|footway|cycleway)(_link)?"]
  feature:
    pre: |-
      {% set width = const.highway[tags.highway].width|default(2) %}
      {% set casingWidth = const.highway[tags.highway].width|default(2) + 2 %}
      {% set fill = false %}
      {% set casingColor = '#d9d0c9' %}
      {% set isBridge = false %}

      {% if (is_area and not const.highway[tags.highway].noFill|default(false)) or tags.area == 'yes' %}
        {% set width = 0 %}
        {% set casingWidth = (const.highway[tags.highway].width|default(2) * const.highway[tags.highway].casingExpand|default(1.5) - const.highway[tags.highway].width|default(2)) %}
        {% set fill = true %}
      {% endif %}

      {% if tags.bridge and tags.bridge != 'no' %}
        {% set casingColor = '#000000' %}
        {% set isBridge = true %}
      {% endif %}
    styles: |-
      {% if const.highway[tags.highway].casingExpand|default(1.5) > 1 %}
        casing_back,casing,
      {% endif %}

      default,{% if const.highway[tags.highway].highlight %}highlight,{% endif %}text
    style:
      width: |-
        {{ width }}
      color: |-
        {{ const.highway[tags.highway].color|default('#ff0000') }}
      fillColor: |-
        {{ const.highway[tags.highway].color|default('#ff0000') }}
      fillOpacity: 1
      fill: |-
        {{ fill }}
      dashArray: |-
        {{ const.highway[tags.highway].dashArray|default('') }}
      zIndex: |-
        {{ tags.layer|default(0) + const.highway[tags.highway].priority|default(0) / 100 }}
      lineCap: |-
        round

    style:highlight:
      width: |-
        {{ 1 }}
      color: |-
        {{ const.highway[tags.highway].highlight|default('#ff0000') }}
      fill: false
      dashArray: |-
        {{ const.highway[tags.highway].highlightDashArray|default('') }}
      zIndex: |-
        {{ tags.layer|default(0) + const.highway[tags.highway].priority|default(0) / 100 + 0.2 }}
      lineCap: round

    style:casing_back:
      width: |-
        {{ casingWidth }}
      color: |-
        {{ casingColor }}
      zIndex: -20

    style:casing:
      width: |-
        {{ casingWidth }}
      color: |-
        {{ casingColor }}
      lineCap: butt
      zIndex: |-
        {{ tags.layer|default(0) - 0.1 }}
    style:text:
      width: 0
      fill: false
      text: |-
        {{ tags.name }}
      zIndex: 1000
      textFontName: DejaVu Sans Book
      textFontSize: 10
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'
      textRepeatSpacing: '500'
      textPlacement: |-
        {{ is_area ? 'point' : 'line' }}

- query:
    12: (way[man_made=bridge];relation[man_made=bridge];)
  feature:
    style:
      width: 1
      color: black
      fill: true
      fillColor: '#7f7f7f'
      fillOpacity: 1
      zIndex: |-
        {{ tags.layer|default(0) - 0.09 }}

- query:
    12: way[railway~"^(tram|subway|rail)$"]
  feature:
    pre: |-
      {% set width = const.railway[tags.railway].width|default(2) %}
      {% set casingWidth = const.railway[tags.railway].width|default(2) * const.railway[tags.railway].casingExpand|default(1.5) %}
      {% set backgroundColor = const.landuse.railway.color %}
      {% set casingColor = const.landuse.railway.color %}
      {% set isBridge = false %}

      {% if tags.bridge and tags.bridge != 'no' %}
        {% set casingColor = '#000000' %}
        {% set isBridge = true %}
      {% endif %}

    styles: |-
      casing_back,casing,background,default

    style:casing_back:
      width: |-
        {{ width + 4 }}
      color: |-
        {{ casingColor }}
      fill: false
      zIndex: -20

    style:casing:
      width: |-
        {{ width + 4 }}
      color: |-
        {{ casingColor }}
      lineCap: butt
      fill: false
      zIndex: |-
        {{ tags.layer|default(0) - 0.1 }}

    style:background:
      width: |-
        {{ width + 2 }}
      color: |-
        {{ backgroundColor }}
      lineCap: butt
      fill: false
      zIndex: |-
        {{ tags.layer|default(0) - 0.09 }}

    style:
      width: |-
        {{ width }}
      color: |-
        {{ const.railway[tags.railway].color|default('#ff0000') }}
      fillColor: |-
        {{ const.railway[tags.railway].color|default('#ff0000') }}
      fill: false
      lineCap: |-
        {{ isBridge ? 'butt' : 'round' }}
      dashArray: |-
        {{ const.railway[tags.railway].dashArray|default('') }}
      zIndex: |-
        {{ tags.layer|default(0) + const.railway[tags.railway].priority|default(0) / 100 }}

- query:
    12: way[waterway]
  feature:
    styles: casing,default,text
    style:
      width: |-
        {% if tags.waterway == 'river' %}5
        {% elseif tags.waterway in ['drain'] %}2
        {% else %}3
        {% endif %}
      color: '#aad3df'
      zIndex: |-
        {{ tags.layer|default(0) - 0.3 }}
    style:casing:
      width: |-
        {% if tags.waterway == 'river' %}7
        {% elseif tags.waterway in ['drain'] %}3
        {% else %}5
        {% endif %}
      color: '#7fc9df'
      zIndex: |-
        {{ tags.layer|default(0) - 0.4 }}
    style:text:
      width: 0
      fill: false
      text: |-
        {{ tags.name }}
      zIndex: 1000
      textFontName: DejaVu Sans Book
      textColor: '#5f8db3'
      textFontSize: 10
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'
      textRepeatSpacing: '500'

- query:
    12: (way[natural=water];relation[natural=water];)
  feature:
    styles: default,text
    style:
      width: 1
      color: '#7fc9df'
      fillColor: '#aad3df'
      fill: true
      fillOpacity: 1
      zIndex: |-
        {{ tags.layer|default(0) - 0.35 }}
    style:text:
      width: 0
      fill: false
      textPlacement: point
      text: |-
        {{ tags.name }}
      zIndex: 999
      textFontName: DejaVu Sans Book
      textColor: '#5f8db3'
      textFontSize: 10
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'

- query:
    12: nwr[building]
  feature:
    pre: |-
      {% set publicBuilding = tags.building in ['government'] or tags.amenity in ['place_of_worship', 'university', 'school', 'college', 'library'] %}
      {% set color = publicBuilding ? '#c3b6ab' : '#d9d0c9' %}
      {% set border = publicBuilding ? '#a79b92' : '#bdaea3' %}
    styles: back,default
    style:
      width: 1
      color: |-
        {{ border }}
      opacity: 0.33
      fill: true
      fillColor: |-
        {{ color }}
      fillOpacity: 0.33
      zIndex: |-
        {{ tags.layer|default(0) + 0.2 }}
    style:back:
      width: 1
      color: |-
        {{ border }}
      fill: true
      fillColor: |-
        {{ color }}
      fillOpacity: 1
      zIndex: |-
        {{ tags.layer|default(0) - 0.2 }}

- query:
    12: nwr[landuse]
  feature:
    style:
      fillColor: |-
        {{ const.landuse[tags.landuse].color|default('#ff0000') }}
      fillOpacity: 1
      fill: true
      width: 0
      zIndex: -25

- query:
    12: nwr[leisure=park]
  feature:
    style:
      fillColor: |-
        {{ const.leisure[tags.leisure].color|default('#ff0000') }}
      fillOpacity: 1
      fill: true
      width: 0
      zIndex: -24.5

- query:
    14: node[natural=tree]
  feature:
    style:
      text: 'tree'
      nodeFeature: Circle
      radius: 0.003
      width: 0
      fill: true
      fillColor: '#b1cda4'
      fillOpacity: 1
      zIndex: |-
        {{ tags.layer|default(0) + 0.1 }}

- query:
    10: way[boundary=administrative][admin_level~"^(2|3|4|5|6|7|8|9)$"];
  feature:
    markerSymbol: false
    style:
      color: '#ff00af'
      width: 2
      dashArray: |-
        {% if tags.admin_level > 4 %}2,2
        {% endif %}
      lineCap: butt
      zIndex: 100

- query:
    10: nwr[railway~'^(station)$']
  feature:
    style:
      text: |-
        {{ tags.name }}
      textPlacement: point
      width: 0
      fill: true
      fillOpacity: 1
      fillColor: '#4b59ae'
      radius: 3
      nodeFeature: CircleMarker
      zIndex: 99
      textColor: '#4b59ae'
      textFontName: DejaVu Sans Bold
      textFontSize: |-
        {{ tags.railway == 'tram_stop' ? 10 : 12 }}
      textHaloRadius: 0.5
      textHaloColor: '#ffffff9f'
      textMoveY: 3

const:
  highway:
    primary:
      color: '#fcd6a4'
      width: 12
      priority: 17.5
    primary_link:
      color: '#fcd6a4'
      width: 6
      priority: 17
    secondary:
      color: '#f7fabf'
      width: 12
      priority: 16.5
    secondary_link:
      color: '#f7fabf'
      width: 6
      priority: 16
    tertiary:
      color: '#ffffff'
      width: 10
      priority: 15.5
    tertiary_link:
      color: '#ffffff'
      width: 5
      priority: 15
    unclassified:
      color: '#ffffff'
      width: 8
      priority: 10
    residential:
      color: '#ffffff'
      width: 8
      priority: 10
    pedestrian:
      color: '#ffffff'
      width: 8
      priority: 11
    living_street:
      color: '#ededed'
      width: 8
      priority: 9
    service:
      color: '#ffffff'
      width: 5
      priority: 5
    cycleway:
      color: '#ffffff'
      width: 3
      noFill: true
      priority: 7
      highlight: '#0000ff'
      highlightDashArray: '2,3'
    footway:
      color: '#ffffff'
      width: 3
      noFill: true
      priority: 6
      highlight: '#f98577'
      highlightDashArray: '2,3'
    path:
      color: '#ffffff'
      width: 3
      noFill: true
      priority: 6
      highlight: '#f98577'
      highlightDashArray: '2,3'

  railway:
    tram:
      color: '#999999'
      width: 1.5
      priority: 41
    subway:
      color: '#999999'
      width: 2
      priority: 42
    rail:
      color: '#999999'
      width: 2.5
      priority: 43

  landuse:
    allotments:
      color: '#b1d291'
    brownfield:
      color: '#c7c7b4'
    cemetery:
      color: '#487549'
    commercial:
      color: '#e0dfdf'
    construction:
      color: '#c7c7b4'
    education:
      color: '#e0dfdf'
    flowerbed:
      color: '#cdebb0'
    forest:
      color: '#add19e'
    garages:
      color: '#eadae7'
    meadow:
      color: '#cdebb0'
    military:
      color: '#c7c7b4'
    grass:
      color: '#cdebb0'
    industrial:
      color: '#c7c7b4'
    railway:
      color: '#eadae7'
    recreation_ground:
      color: '#b8b7b7'
    religious:
      color: '#e0dfdf'
    residential:
      color: '#e0dfdf'
    retail:
      color: '#e0dfdf'
    village_green:
      color: '#cdebb0'

  leisure:
    park:
      color: '#c8facc'
